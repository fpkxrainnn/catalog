<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPKxRAINNN — Product Catalog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-pink: #FFF4F7;
      --card-white: #FFFFFF;
      --pill-pink: #FDE8EF;
      --btn-pink: #FAD2DF;
      --btn-pink-hover: #F5BFD1;
      --brown-dark: #633D1E;
      --brown-medium: #8C6A52;
      --brown-light: #B59B8A;
      --input-bg: #FAF6F5;
      --border-soft: #F3E5E9;
      --shadow-soft: 0 10px 30px rgba(99, 61, 30, 0.06);
      --shadow-hover: 0 14px 36px rgba(99, 61, 30, 0.11);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background-color: var(--bg-pink);
      color: var(--brown-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
    }

    /* Header */
    header {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 20px;
      text-align: center;
    }

    .brand-badge {
      display: inline-block;
      background-color: var(--card-white);
      color: var(--brown-dark);
      font-family: 'Quicksand', 'Kanit', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      padding: 6px 20px;
      border-radius: 999px;
      box-shadow: 0 4px 14px rgba(99, 61, 30, 0.05);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.85rem;
      font-weight: 600;
      color: var(--brown-dark);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--brown-medium);
      font-weight: 300;
    }

    /* Search & Filter Bar */
    .controls {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto 24px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .search-box {
      width: 100%;
      max-width: 440px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 18px 12px 42px;
      border-radius: 16px;
      border: 1.5px solid var(--border-soft);
      background-color: var(--card-white);
      color: var(--brown-dark);
      font-family: 'Kanit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(99, 61, 30, 0.03);
      transition: border-color 0.2s;
    }

    .search-box input::placeholder {
      color: var(--brown-light);
    }

    .search-box input:focus {
      border-color: var(--btn-pink);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--brown-light);
      font-size: 1rem;
      pointer-events: none;
    }

    .category-tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn {
      background-color: var(--card-white);
      color: var(--brown-medium);
      border: 1px solid var(--border-soft);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: 'Kanit', sans-serif;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background-color: var(--pill-pink);
    }

    .tab-btn.active {
      background-color: var(--btn-pink);
      color: var(--brown-dark);
      font-weight: 500;
      border-color: var(--btn-pink);
      box-shadow: 0 4px 12px rgba(250, 210, 223, 0.6);
    }

    /* Product Grid */
    main {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 0 20px 40px;
      flex: 1;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    @media (max-width: 520px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
      }
    }

    .product-card {
      background-color: var(--card-white);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      background-color: var(--input-bg);
      position: relative;
      margin-bottom: 12px;
    }

    .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .product-card:hover .img-wrapper img {
      transform: scale(1.04);
    }

    .status-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background-color: rgba(255, 255, 255, 0.92);
      color: var(--brown-dark);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--brown-light);
      margin-bottom: 2px;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 500;
      color: var(--brown-dark);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .card-price {
      font-size: 1rem;
      font-weight: 600;
      color: var(--brown-dark);
    }

    .view-pill {
      background-color: var(--pill-pink);
      color: var(--brown-dark);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(99, 61, 30, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      display: flex;
      opacity: 1;
    }

    .modal-card {
      background-color: var(--card-white);
      width: 100%;
      max-width: 540px;
      max-height: 90vh;
      border-radius: 28px;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(99, 61, 30, 0.18);
      position: relative;
      animation: popUp 0.24s ease;
    }

    @keyframes popUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background-color: var(--pill-pink);
      color: var(--brown-dark);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .modal-main-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      overflow: hidden;
      background-color: var(--input-bg);
      margin-bottom: 12px;
    }

    .modal-main-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
    }

    .thumb-item {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.65;
      transition: all 0.18s;
    }

    .thumb-item.active {
      border-color: var(--brown-dark);
      opacity: 1;
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .modal-cat {
      background-color: var(--pill-pink);
      color: var(--brown-dark);
      font-size: 0.78rem;
      padding: 3px 12px;
      border-radius: 999px;
    }

    .modal-status {
      font-size: 0.78rem;
      color: var(--brown-medium);
    }

    .modal-title {
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--brown-dark);
      margin-bottom: 4px;
    }

    .modal-price {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--brown-dark);
      margin-bottom: 14px;
    }

    .modal-desc {
      background-color: var(--input-bg);
      padding: 14px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      color: var(--brown-medium);
      white-space: pre-line;
      margin-bottom: 18px;
    }

    .line-order-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px 20px;
      background-color: var(--btn-pink);
      color: var(--brown-dark);
      font-family: 'Kanit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.15s;
      box-shadow: 0 6px 18px rgba(250, 210, 223, 0.7);
    }

    .line-order-btn:hover {
      background-color: var(--btn-pink-hover);
      transform: translateY(-1px);
    }

    .copy-hint {
      text-align: center;
      font-size: 0.78rem;
      color: var(--brown-light);
      margin-top: 8px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--brown-dark);
      color: #FFFFFF;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 2000;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 24px 20px 32px;
      color: var(--brown-light);
      font-size: 0.82rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .social-pill {
      background-color: var(--card-white);
      color: var(--brown-dark);
      text-decoration: none;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(99, 61, 30, 0.04);
      transition: background-color 0.2s;
    }

    .social-pill:hover {
      background-color: var(--btn-pink);
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--brown-light);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-badge">FPKxRAINNN</div>
    <h1>Product Catalog</h1>
    <p class="subtitle">เลือกชมสินค้าทั้งหมด กดที่รูปเพื่อดูรายละเอียดและสั่งซื้อผ่าน LINE</p>
  </header>

  <section class="controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="ค้นหาชื่อสินค้า..." />
    </div>
    <div class="category-tabs" id="categoryTabs"></div>
  </section>

  <main>
    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer>
    <div class="social-links">
      <a href="https://lin.ee/6qFXvvj" target="_blank" rel="noopener" class="social-pill">LINE Official</a>
      <a href="https://x.com/Fpkxrainnn" target="_blank" rel="noopener" class="social-pill">X : @Fpkxrainnn</a>
    </div>
    <p>© 2026 FPKxRAINNN. All rights reserved.</p>
  </footer>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <button class="close-btn" id="closeModal" aria-label="ปิด">✕</button>
      <div class="modal-main-img">
        <img id="modalMainImg" src="" alt="Product Image" />
      </div>
      <div class="thumb-row" id="modalThumbs"></div>
      <div class="modal-meta">
        <span class="modal-cat" id="modalCategory"></span>
        <span class="modal-status" id="modalStatus"></span>
      </div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <button class="line-order-btn" id="orderLineBtn">
        <span>ทัก LINE สั่งซื้อสินค้านี้</span>
      </button>
      <p class="copy-hint">ระบบจะคัดลอกชื่อสินค้าให้อัตโนมัติ สามารถกดวางในแชท LINE ได้เลย</p>
    </div>
  </div>

  <div class="toast" id="toast">คัดลอกชื่อสินค้าแล้ว กำลังเปิด LINE...</div>

  <script>
    // ==========================================
    // ตั้งค่าร้านค้าและลิงก์ Google Sheets (CSV)
    // ==========================================
    const LINE_URL = "https://lin.ee/6qFXvvj";

    // หากต้องการดึงข้อมูลจาก Google Sheets ให้วางลิงก์ Publish to web (รูปแบบ CSV) ที่นี่
    // หากเว้นว่างไว้ ("") เว็บจะแสดงข้อมูลสินค้าตัวอย่างด้านล่างแทน
    const GOOGLE_SHEET_CSV_URL = "";

    // ข้อมูลสินค้าตัวอย่าง (แก้ไขหรือเพิ่มรายการตรงนี้ได้เลยหากยังไม่เชื่อม Google Sheets)
    let products = [
      {
        id: "P01",
        category: "หมวดหมู่ A",
        name: "สินค้าตัวอย่างชิ้นที่ 1 (Minimal Edition)",
        price: "250 บาท",
        status: "พร้อมส่ง",
        description: "• ขนาด: 10 x 15 ซม.\n• รายละเอียด: วัสดุคุณภาพดี สีละมุนตรงปก\n• สอบถามเพิ่มเติมหรือขอดูรูปเพิ่มเติมทักแชทได้เลยค่ะ",
        images: [
          "https://placehold.co/600x600/FAD2DF/633D1E?text=Product+01+Main",
          "https://placehold.co/600x600/FDE8EF/633D1E?text=Product+01+Detail+2",
          "https://placehold.co/600x600/FFF4F7/633D1E?text=Product+01+Detail+3"
        ]
      },
      {
        id: "P02",
        category: "หมวดหมู่ B",
        name: "สินค้าตัวอย่างชิ้นที่ 2 (Custom Set)",
        price: "390 บาท",
        status: "พรีออเดอร์",
        description: "• สามารถเลือกแบบหรือปรับแต่งรายละเอียดได้\n• ระยะเวลารอสินค้าประมาณ 7-14 วัน\n• ทัก LINE เพื่อแจ้งแบบที่ต้องการได้เลยค่ะ",
        images: [
          "https://placehold.co/600x600/FDE8EF/633D1E?text=Product+02+Main",
          "https://placehold.co/600x600/FAD2DF/633D1E?text=Product+02+Size"
        ]
      },
      {
        id: "P03",
        category: "หมวดหมู่ A",
        name: "สินค้าตัวอย่างชิ้นที่ 3 (Limited Item)",
        price: "180 บาท",
        status: "พร้อมส่ง",
        description: "• สินค้ามีจำนวนจำกัด\n• จัดส่งทุกวันจันทร์ - เสาร์",
        images: [
          "https://placehold.co/600x600/F5BFD1/633D1E?text=Product+03+Main"
        ]
      },
      {
        id: "P04",
        category: "หมวดหมู่ C",
        name: "สินค้าตัวอย่างชิ้นที่ 4 (Special Pack)",
        price: "450 บาท",
        status: "พร้อมส่ง",
        description: "• เซตสุดคุ้ม ได้ครบชุดตามภาพ\n• แพ็กกันกระแทกอย่างดีทุกออเดอร์",
        images: [
          "https://placehold.co/600x600/FAD2DF/633D1E?text=Product+04+Main",
          "https://placehold.co/600x600/FDE8EF/633D1E?text=Product+04+Angle+2"
        ]
      }
    ];

    let activeCategory = "ทั้งหมด";
    let searchQuery = "";
    let selectedProduct = null;

    const productGrid = document.getElementById("productGrid");
    const categoryTabs = document.getElementById("categoryTabs");
    const searchInput = document.getElementById("searchInput");
    const modal = document.getElementById("productModal");
    const toast = document.getElementById("toast");

    // ฟังก์ชันแปลง CSV จาก Google Sheets
    function parseCSV(text) {
      const rows = [];
      let row = [], col = "", inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], next = text[i + 1];
        if (c === '"' && inQuotes && next === '"') { col += '"'; i++; }
        else if (c === '"') { inQuotes = !inQuotes; }
        else if (c === ',' && !inQuotes) { row.push(col.trim()); col = ""; }
        else if ((c === '\n' || (c === '\r' && next === '\n')) && !inQuotes) {
          if (c === '\r') i++;
          row.push(col.trim());
          if (row.some(cell => cell !== "")) rows.push(row);
          row = []; col = "";
        } else { col += c; }
      }
      if (col || row.length) { row.push(col.trim()); rows.push(row); }
      return rows;
    }

    async function loadFromGoogleSheets() {
      if (!GOOGLE_SHEET_CSV_URL) return;
      try {
        const res = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await res.text();
        const rows = parseCSV(csvText);
        if (rows.length > 1) {
          // โครงสร้างคอลัมน์ในชีต:
          // [0] รหัส, [1] หมวดหมู่, [2] ชื่อสินค้า, [3] ราคา, [4] รายละเอียด, [5] รูปหลัก, [6] รูปเพิ่มเติม(คั่นด้วย ,), [7] สถานะ
          products = rows.slice(1).map((r, idx) => {
            const extraImgs = r[6] ? r[6].split(",").map(s => s.trim()).filter(Boolean) : [];
            const allImgs = [r[5], ...extraImgs].filter(Boolean);
            return {
              id: r[0] || `ITEM-${idx + 1}`,
              category: r[1] || "ทั่วไป",
              name: r[2] || "ไม่มีชื่อสินค้า",
              price: r[3] || "สอบถามราคา",
              description: r[4] || "-",
              images: allImgs.length ? allImgs : ["https://placehold.co/600x600/FAD2DF/633D1E?text=No+Image"],
              status: r[7] || ""
            };
          });
        }
      } catch (err) {
        console.error("โหลดข้อมูลจาก Google Sheets ไม่สำเร็จ:", err);
      }
    }

    function renderCategories() {
      const categories = ["ทั้งหมด", ...new Set(products.map(p => p.category))];
      categoryTabs.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `tab-btn ${cat === activeCategory ? "active" : ""}`;
        btn.textContent = cat;
        btn.onclick = () => {
          activeCategory = cat;
          renderCategories();
          renderProducts();
        };
        categoryTabs.appendChild(btn);
      });
    }

    function renderProducts() {
      const filtered = products.filter(p => {
        const matchCat = activeCategory === "ทั้งหมด" || p.category === activeCategory;
        const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                            p.description.toLowerCase().includes(searchQuery.toLowerCase());
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        productGrid.innerHTML = `<div class="empty-state">ไม่พบสินค้าที่ค้นหา ลองเลือกหมวดหมู่อื่นดูนะคะ</div>`;
        return;
      }

      productGrid.innerHTML = filtered.map(p => `
        <article class="product-card" onclick="openProductModal('${p.id}')">
          <div class="img-wrapper">
            ${p.status ? `<span class="status-tag">${p.status}</span>` : ""}
            <img src="${p.images[0]}" alt="${p.name}" loading="lazy" />
          </div>
          <div class="card-category">${p.category}</div>
          <h3 class="card-title">${p.name}</h3>
          <div class="card-footer">
            <span class="card-price">${p.price}</span>
            <span class="view-pill">ดูรายละเอียด</span>
          </div>
        </article>
      `).join("");
    }

    window.openProductModal = function(id) {
      selectedProduct = products.find(p => p.id === id);
      if (!selectedProduct) return;

      document.getElementById("modalMainImg").src = selectedProduct.images[0];
      document.getElementById("modalCategory").textContent = selectedProduct.category;
      document.getElementById("modalStatus").textContent = selectedProduct.status ? `• ${selectedProduct.status}` : "";
      document.getElementById("modalTitle").textContent = selectedProduct.name;
      document.getElementById("modalPrice").textContent = selectedProduct.price;
      document.getElementById("modalDesc").textContent = selectedProduct.description;

      const thumbsContainer = document.getElementById("modalThumbs");
      if (selectedProduct.images.length > 1) {
        thumbsContainer.style.display = "flex";
        thumbsContainer.innerHTML = selectedProduct.images.map((imgUrl, index) => `
          <div class="thumb-item ${index === 0 ? "active" : ""}" onclick="changeModalImage(this, '${imgUrl}')">
            <img src="${imgUrl}" alt="Thumbnail ${index + 1}" />
          </div>
        `).join("");
      } else {
        thumbsContainer.style.display = "none";
      }

      modal.classList.add("open");
      document.body.style.overflow = "hidden";
    };

    window.changeModalImage = function(el, url) {
      document.getElementById("modalMainImg").src = url;
      document.querySelectorAll(".thumb-item").forEach(item => item.classList.remove("active"));
      el.classList.add("active");
    };

    function closeProductModal() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("closeModal").onclick = closeProductModal;
    modal.onclick = (e) => {
      if (e.target === modal) closeProductModal();
    };

    document.getElementById("orderLineBtn").onclick = async () => {
      if (!selectedProduct) return;
      const orderText = `สนใจสั่งซื้อสินค้า: ${selectedProduct.name} (${selectedProduct.price})`;
      try {
        await navigator.clipboard.writeText(orderText);
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2500);
      } catch (err) {
        // ข้ามกรณีเบราว์เซอร์บล็อก clipboard
      }
      setTimeout(() => {
        window.open(LINE_URL, "_blank", "noopener");
      }, 450);
    };

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    (async function init() {
      await loadFromGoogleSheets();
      renderCategories();
      renderProducts();
    })();
  </script>
</body>
</html>
